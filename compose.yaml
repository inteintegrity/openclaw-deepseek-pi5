name: openclaw-deepseek
services:
  openclaw:
    build: .
    image: openclaw-deepseek-pi5:2026.10.10
    init: true
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-18889}:18789"
    environment:
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:?Set DEEPSEEK_BASE_URL in .env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in .env}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:?Set DEEPSEEK_MODEL in .env}
      ALLOW_PRIVATE_NETWORK: ${ALLOW_PRIVATE_NETWORK:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:18889}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - state:/home/node/.openclaw
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, /app/deployment/health.mjs]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 60s
    stop_grace_period: 30s
volumes:
  state:
